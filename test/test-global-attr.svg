<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="350">
  <text x="50" y="20" font-size="12" fill="black" >Without global attributes:</text>
  <line x1="50" y1="40" x2="150" y2="40" stroke="black" stroke-width="2" marker-end="url(#TEST-ARROW)" />
  <text x="50" y="70" font-size="12" fill="black" stroke="none" stroke-width="3" stroke="red" >Global stroke=red, stroke-width=3:</text>
  <line x1="50" y1="90" x2="150" y2="90" marker-end="url(#TEST-ARROW)" stroke-width="3" stroke="red" />
  <text x="50" y="110" font-size="12" fill="black" transform="translate(200,0) " >Global translate=(200,0):</text>
  <line x1="50" y1="130" x2="150" y2="130" stroke="blue" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="translate(200,0) " />
  <text x="50" y="150" font-size="12" fill="black" transform="translate(0,100) " >Global translate=(0,100), local translate=(50,0):</text>
  <line x1="50" y1="170" x2="150" y2="170" stroke="green" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="translate(50,0) translate(0,100) " />
  <text x="50" y="210" font-size="12" fill="black" stroke="none" stroke-width="3" stroke="purple" transform="translate(0,150) " >Global stroke=purple, translate=(0,150):</text>
  <line x1="50" y1="230" x2="150" y2="230" marker-start="url(#TEST-DOT)" marker-end="url(#TEST-ARROW)" stroke-width="3" stroke="purple" transform="translate(0,150) " />
  <text x="50" y="270" font-size="12" fill="black" >After clearing global attributes:</text>
  <line x1="50" y1="290" x2="150" y2="290" stroke="orange" stroke-width="2" marker-end="url(#TEST-ARROW)" />
  <text x="50" y="310" font-size="12" fill="black" transform="rotate(15) " >Global rotate=15:</text>
  <line x1="50" y1="330" x2="150" y2="330" stroke="cyan" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="rotate(15) " />
  <defs>
    <marker id="TEST-ARROW" refX="0.0" refY="7.5" markerWidth="15.0" markerHeight="15.0" viewBox="0 0 15.0 15.0" orient="auto" markerUnits="userSpaceOnUse">
      <g transform="scale(1.5,1.5)"><path d="M0,0 L0,10 L10,5 z" fill="context-stroke" /></g>
    </marker>
    <marker id="TEST-DOT" refX="5" refY="5" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="5" fill="context-stroke" />
    </marker>
  </defs>
</svg>
