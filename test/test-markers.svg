<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="200">
  <rect x="0" y="0" width="600" height="200" fill="white" />
  <line x1="30" y1="30" x2="80" y2="30" stroke="black" stroke-width="2" marker-end="url(#arrow1)" />
  <line x1="30" y1="50" x2="80" y2="50" stroke="black" stroke-width="2" marker-end="url(#dot1)" />
  <line x1="30" y1="70" x2="80" y2="70" stroke="black" stroke-width="2" marker-end="url(#square1)" />
  <line x1="30" y1="90" x2="80" y2="90" stroke="black" stroke-width="2" marker-end="url(#diamond1)" />
  <line x1="30" y1="110" x2="80" y2="110" stroke="black" stroke-width="2" marker-end="url(#triangle1)" />
  <line x1="30" y1="130" x2="80" y2="130" stroke="black" stroke-width="2" marker-end="url(#cross1)" />
  <line x1="30" y1="150" x2="80" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow-open1)" />
  <line x1="30" y1="170" x2="80" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow1)" />
  <text x="90" y="35" font-size="12" >arrow</text>
  <text x="90" y="55" font-size="12" >circle-dot</text>
  <text x="90" y="75" font-size="12" >square-dot</text>
  <text x="90" y="95" font-size="12" >diamond</text>
  <text x="90" y="115" font-size="12" >triangle</text>
  <text x="90" y="135" font-size="12" >cross</text>
  <text x="90" y="155" font-size="12" >arrow-open</text>
  <text x="90" y="175" font-size="12" >arrow (was arrow-filled)</text>
  <defs>
    <marker id="arrow1" refX="0" refY="5.00" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L10,5.00 z" fill="context-stroke" />
    </marker>
    <marker id="dot1" refX="5" refY="5" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="5" fill="context-stroke" />
    </marker>
    <marker id="square1" refX="5" refY="5" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" fill="context-stroke" />
    </marker>
    <marker id="diamond1" refX="5" refY="5" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M5,0 L10,5 L5,10 L0,5 z" fill="context-stroke" />
    </marker>
    <marker id="triangle1" refX="0" refY="5.00" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L10,5.00 z" fill="context-stroke" />
    </marker>
    <marker id="cross1" refX="5" refY="5" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3,5 L7,5 M5,3 L5,7" stroke="context-stroke" stroke-width="2" fill="none" />
    </marker>
    <marker id="arrow-open1" refX="0" refY="5.00" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L10,5.00 z" fill="white" stroke="context-stroke" stroke-width="1.50" />
    </marker>
  </defs>
</svg>
