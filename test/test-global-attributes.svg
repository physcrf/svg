<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="350">
  <rect x="0" y="0" width="600" height="350" fill="white" />
  <text x="50" y="20" font-size="12" fill="black" >Without global attributes:</text>
  <line x1="50" y1="40" x2="150" y2="40" stroke="black" stroke-width="2" marker-end="url(#TEST-ARROW)" />
  <text x="50" y="60" font-size="12" fill="black" stroke="none" stroke-width="3" >Global stroke=red, stroke-width=3:</text>
  <line x1="50" y1="80" x2="150" y2="80" marker-end="url(#TEST-ARROW)" stroke-width="3" stroke="red" />
  <text x="50" y="100" font-size="12" fill="black" transform="translate(200,0)" >Global translate=(200,0):</text>
  <line x1="50" y1="120" x2="150" y2="120" stroke="blue" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="translate(200,0)" />
  <text x="50" y="140" font-size="12" fill="black" transform="translate(0,50)" >Global translate=(0,50), local translate=(50,0):</text>
  <line x1="50" y1="160" x2="150" y2="160" stroke="green" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="translate(50,0)" />
  <text x="50" y="180" font-size="12" fill="black" stroke="none" stroke-width="3" transform="translate(0,100)" >Global stroke=purple, translate=(0,100):</text>
  <line x1="50" y1="200" x2="150" y2="200" marker-start="url(#TEST-DOT)" marker-end="url(#TEST-ARROW)" stroke-width="3" stroke="purple" transform="translate(0,100)" />
  <text x="50" y="280" font-size="12" fill="black" transform="rotate(15)" >Global rotate=15:</text>
  <line x1="100" y1="280" x2="200" y2="280" stroke="orange" stroke-width="2" marker-end="url(#TEST-ARROW)" transform="rotate(15)" />
  <defs>
    <marker id="TEST-ARROW" refX="0.00" refY="7.50" markerWidth="15.00" markerHeight="15.00"
            viewBox="0 0 15.00 15.00" orient="auto" markerUnits="userSpaceOnUse">
      <g transform="scale(1.50,1.50)"><path d="M0,0 L0,10 L10,5.00 z" fill="context-stroke" /></g>
    </marker>
    <marker id="TEST-DOT" refX="5" refY="5" markerWidth="10" markerHeight="10"
            viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="5" fill="context-stroke" />
    </marker>
  </defs>
</svg>
